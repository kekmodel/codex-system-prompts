# extractor/allow_list.toml
#
# Curated list of prompt-bearing source symbols Pass 1 cannot detect mechanically.
# Each entry has:
#   kind         : "rust_const_str" | "rust_fn_static_str" | "rust_inline_at_marker"
#   file         : path under codex-rs/ to the .rs file
#   symbol       : (rust_const_str / rust_fn_static_str) — the constant/function name
#   marker       : (rust_inline_at_marker) — string to anchor on; first r#"..."# after wins
#   category     : prompts/<category>/ destination
#   filename     : kebab-case stem (no .md)
#   description  : one-line rationale, written into frontmatter
#   reviewed_at  : codex commit SHA when this entry was last verified upstream
#
# See /SPEC.md §2.1 (B), §2.3.1 (shim function list).

