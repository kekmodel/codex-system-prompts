# Mirror upstream codex tags (SPEC §8.3 — manual mode)
#
# Manual dispatch only. When invoked, runs the extractor against the
# specified upstream tag (or the latest rust-v* tag if none given) and
# opens a PR titled "Update mirror for <tag>" containing the prompt diff
# + auto-generated CHANGELOG entry.

name: Mirror upstream codex

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Specific upstream tag to extract (default: latest rust-v*)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mirror-extract
  cancel-in-progress: false  # let an in-flight run finish before the next

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mirror repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # tags + history needed to compare against current snapshot

      - name: Setup uv (Python)
        uses: astral-sh/setup-uv@v4

      - name: Setup Rust toolchain (codex's pinned 1.93.0)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.0"
          components: clippy, rustfmt, rust-src

      - name: Clone openai/codex (full tags)
        run: |
          git clone --filter=blob:none https://github.com/openai/codex.git /tmp/codex
          git -C /tmp/codex fetch --tags

      - name: Determine target tag
        id: tags
        run: |
          set -euo pipefail
          # Read all rust-v* tags into a variable first, then take the head.
          # Avoids SIGPIPE-from-head propagating under `set -o pipefail` when
          # upstream has thousands of tags and the producer is still writing.
          if [ -n "${{ inputs.tag }}" ]; then
            TARGET="${{ inputs.tag }}"
          else
            UPSTREAM_TAGS=$(git -C /tmp/codex tag --sort=-creatordate)
            TARGET=$(printf '%s\n' "$UPSTREAM_TAGS" | grep '^rust-v' | head -1 || true)
          fi
          if [ -z "$TARGET" ]; then
            echo "Could not determine target rust-v* tag from upstream." >&2
            exit 1
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

          OUR_TAGS=$(git tag --sort=-creatordate || true)
          OURS=$(printf '%s\n' "$OUR_TAGS" | grep '^rust-v' | head -1 || true)
          echo "ours=$OURS" >> "$GITHUB_OUTPUT"
          echo "Target: $TARGET"
          echo "Ours:   $OURS"

      - name: Skip if mirror is already at target
        if: steps.tags.outputs.target == steps.tags.outputs.ours && steps.tags.outputs.target != ''
        run: |
          echo "Mirror already at ${{ steps.tags.outputs.target }}; nothing to do."
          # exit 0 leaves later steps to skip via if: condition
        # Use an env flag for downstream steps:
      - name: Set up_to_date env
        run: |
          if [ "${{ steps.tags.outputs.target }}" = "${{ steps.tags.outputs.ours }}" ] && [ -n "${{ steps.tags.outputs.target }}" ]; then
            echo "UP_TO_DATE=1" >> "$GITHUB_ENV"
          else
            echo "UP_TO_DATE=0" >> "$GITHUB_ENV"
          fi

      - name: Checkout codex at target tag
        if: env.UP_TO_DATE == '0'
        run: |
          git -C /tmp/codex checkout "${{ steps.tags.outputs.target }}"

      - name: Install extractor
        if: env.UP_TO_DATE == '0'
        working-directory: extractor
        run: uv sync

      - name: Run extractor (write mode)
        if: env.UP_TO_DATE == '0'
        working-directory: extractor
        run: |
          uv run extractor extract \
            --codex-root /tmp/codex \
            --tag "${{ steps.tags.outputs.target }}" \
            --out .. \
            --mode write

      - name: Run verify (Pass 4 — Layer A + B + auxiliary)
        if: env.UP_TO_DATE == '0'
        working-directory: extractor
        run: |
          uv run extractor verify \
            --codex-root /tmp/codex \
            --out ..

      - name: Create branch + PR if there is a prompt diff
        if: env.UP_TO_DATE == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "codex-mirror-bot"
          git config user.email "codex-mirror-bot@users.noreply.github.com"

          if git diff --quiet && git diff --cached --quiet; then
            echo "No prompt diff vs HEAD; tag '${{ steps.tags.outputs.target }}' had no captured-prompt change."
            echo "Per SPEC §3.5 selective tagging, no mirror commit/tag is created."
            exit 0
          fi

          BRANCH="auto-mirror/${{ steps.tags.outputs.target }}"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "Update mirror for ${{ steps.tags.outputs.target }}"
          git push -u origin "$BRANCH"

          gh pr create \
            --title "Update mirror for ${{ steps.tags.outputs.target }}" \
            --body "Auto-generated by \`.github/workflows/extract.yml\`. See CHANGELOG.md for the prompt diff. Verify (Pass 4) passed before this PR was opened." \
            --base main \
            --head "$BRANCH"
